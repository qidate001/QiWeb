<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what2eat - 今天吃点啥</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
        <!-- 左侧：筛选栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">🍽️ what2eat</div>
            </div>

            <div class="sidebar-body">
                <!-- 忌口排除 (支持左键包含/右键排除) -->
                <div class="filter-section">
                    <div class="filter-label">🚫 忌口排除 <span style="font-size:12px;color:#666;font-weight:normal;">(左键包含·右键排除)</span></div>
                    <div id="avoid-filters" class="tag-wrapper"></div>
                </div>
                
                <!-- 肉类：基本偏好 (互斥) -->
                <div class="filter-section">
                    <div class="filter-label">🥩 基本偏好</div>
                    <div id="meat-base-filters" class="tag-wrapper">
                        <div class="tag-btn active" data-type="meat-base" data-label="无偏好" data-state="1">无偏好</div>
                        <div class="tag-btn" data-type="meat-base" data-label="素食" data-state="0">素食</div>
                    </div>
                </div>

                <!-- 肉类：特定限制 (互斥) -->
                <div class="filter-section">
                    <div class="filter-label">❌ 肉食限制</div>
                    <div id="meat-exclude-filters" class="tag-wrapper">
                        <div class="tag-btn" data-type="meat-exclude" data-label="不吃红肉" data-state="0">不吃红肉</div>
                        <div class="tag-btn" data-type="meat-exclude" data-label="不吃白肉" data-state="0">不吃白肉</div>
                        <div class="tag-btn" data-type="meat-exclude" data-label="不吃海鲜" data-state="0">不吃海鲜</div>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-label">🌍 菜系偏好 (互斥)</div>
                    <div id="cuisine-filters" class="tag-wrapper"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="reset-btn" class="reset-btn">🔄 重置所有筛选</button>
            </div>
        </aside>

        <!-- 右侧：核心抽取面板 -->
        <main class="main-panel">
            <div class="panel-center">
                <div class="main-title">今天吃点啥？</div>
                
                <div class="result-wrapper">
                    <div class="result-card" id="result">加载数据中...</div>
                    <div class="match-count" id="match-count">配置偏好，寻找灵感</div>
                </div>

                <button id="pick-btn" class="action-btn">🎲 随机抽一个</button>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
