<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what2eat - 今天吃点啥</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>🍽️ 今天吃点啥？</h1>
        
        <!-- 过滤器区域 -->
        <div class="filter-panel" id="filter-panel">
            <div class="filter-group">
                <label>🚫 忌口（点击可切换）</label>
                <div id="avoid-filters" class="tag-wrapper"></div>
            </div>
            <div class="filter-group">
                <label>🌍 菜系偏好</label>
                <div id="cuisine-filters" class="tag-wrapper"></div>
            </div>
            <button id="reset-btn" class="reset-btn">🔄 重置所有筛选</button>
        </div>

        <!-- 结果展示区 -->
        <div class="result-wrapper">
            <div class="result-card" id="result">正在加载...</div>
            <div class="match-count" id="match-count"></div>
        </div>
        
        <!-- 抽卡按钮 -->
        <button id="pick-btn">🎲 随机抽一个</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
