<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what2eat - 今天吃点啥</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
        <!-- 左侧：忌口/菜系筛选栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">🍽️ what2eat</div>
            </div>

            <div class="sidebar-body">
                <div class="filter-section">
                    <div class="filter-label">🚫 忌口排除</div>
                    <div id="avoid-filters" class="tag-wrapper"></div>
                    <!-- 替换或增加到 <div class="sidebar-body"> 内部 -->
                </div>
                
                

                <div class="filter-section">
                    <div class="filter-label">🥩 肉类偏好</div>
                    <div id="meat-filters" class="tag-wrapper">
                        <div class="tag-btn active" data-type="meat" data-label="无偏好">无偏好</div>
                        <div class="tag-btn" data-type="meat" data-label="素食">素食</div>
                        <div class="tag-btn" data-type="meat" data-label="不吃红肉">不吃红肉</div>
                        <div class="tag-btn" data-type="meat" data-label="不吃白肉">不吃白肉</div>
                        <div class="tag-btn" data-type="meat" data-label="不吃海鲜">不吃海鲜</div>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-label">🧬 嘌呤关注</div>
                    <div id="purine-filters" class="tag-wrapper">
                        <div class="tag-btn active" data-type="purine" data-label="无偏好">无偏好</div>
                        <div class="tag-btn" data-type="purine" data-label="忌高嘌呤">忌高嘌呤</div>
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-label">🌍 菜系偏好</div>
                    <div id="cuisine-filters" class="tag-wrapper"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="reset-btn" class="reset-btn">🔄 重置所有筛选</button>
            </div>
        </aside>

        <!-- 右侧：核心抽取面板 -->
        <main class="main-panel">
            <div class="panel-center">
                <div class="main-title">今天吃点啥？</div>
                
                <div class="result-wrapper">
                    <div class="result-card" id="result">正在加载数据...</div>
                    <div class="match-count" id="match-count">选择左侧偏好，寻找灵感</div>
                </div>

                <button id="pick-btn" class="action-btn">🎲 随机抽一个</button>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
