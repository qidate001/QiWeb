<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>what2eat - 今天吃点啥</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <div class="container">
        <h1>🍽️ 今天吃点啥？</h1>
        
        <!-- 结果展示区 -->
        <div class="result-card" id="result">准备就绪，点我一下</div>
        
        <!-- 按钮 -->
        <button id="pick-btn">🎲 随机抽一个</button>
        
        <p class="hint">如果不想吃，多点几次换一换</p>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
